suite: dex-server/service.yaml
values:
  - ../test/values-unittest.yaml
templates:
  - templates/dex-server/service.yaml
tests:
  - it: is not rendered when Dex is disabled (default)
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the Dex Service when OIDC + Dex are enabled
    set:
      api.oidc.enabled: true
      api.oidc.dex.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: kargo-dex-server
      - equal:
          path: spec.ports[0].port
          value: 443
      - equal:
          path: spec.ports[0].targetPort
          value: 5556

---
suite: dex-server/deployment.yaml
values:
  - ../test/values-unittest.yaml
templates:
  - templates/dex-server/deployment.yaml
  - templates/dex-server/secret.yaml
tests:
  - it: is not rendered when Dex is disabled (default)
    template: templates/dex-server/deployment.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the Dex Deployment when OIDC + Dex are enabled
    template: templates/dex-server/deployment.yaml
    set:
      api.oidc.enabled: true
      api.oidc.dex.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: kargo-dex-server

---
suite: dex-server/secret.yaml
values:
  - ../test/values-unittest.yaml
templates:
  - templates/dex-server/secret.yaml
tests:
  - it: is not rendered when Dex is disabled (default)
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the Dex config Secret when OIDC + Dex are enabled
    set:
      api.oidc.enabled: true
      api.oidc.dex.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: kargo-dex-server

  - it: omits the expiry block when no expiry values are set (default)
    set:
      api.oidc.enabled: true
      api.oidc.dex.enabled: true
    asserts:
      - notMatchRegex:
          path: stringData["config.yaml"]
          pattern: "expiry:"

  - it: renders the expiry block when expiry values are set
    set:
      api.oidc.enabled: true
      api.oidc.dex.enabled: true
      api.oidc.dex.expiry:
        idTokens: 2m
        refreshTokens:
          validIfNotUsedFor: 24h
    asserts:
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "\nexpiry:\n  idTokens: 2m\n"
      - matchRegex:
          path: stringData["config.yaml"]
          pattern: "\n  refreshTokens:\n    validIfNotUsedFor: 24h\n"
